<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Magi Quest Academy</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: radial-gradient(circle at center, #141628, #060710);
      font-family: 'Trebuchet MS', sans-serif;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }
    .header {
      text-align: center;
      margin-bottom: 48px;
      z-index: 10;
    }
    .header h1 {
      color: #ffe39b;
      font-size: 36px;
      letter-spacing: 2px;
      margin: 0 0 8px 0;
      text-shadow: 0 0 20px rgba(255, 227, 155, 0.3);
    }
    .header p {
      color: #a4b1d6;
      font-size: 16px;
      margin: 0;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .cards {
      display: flex;
      gap: 32px;
      z-index: 10;
      flex-wrap: wrap;
      justify-content: center;
    }
    .card {
      background: rgba(20, 20, 32, 0.82);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 22px;
      backdrop-filter: blur(10px);
      width: min(340px, 42vw);
      padding: 32px;
      text-align: center;
      transition: 0.2s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .card:hover {
      transform: translateY(-6px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }
    .card-emoji {
      font-size: 48px;
      margin-bottom: 16px;
    }
    .card h2 {
      font-size: 24px;
      margin: 0 0 8px 0;
      color: #fff;
    }
    .card p.subtitle {
      color: #dce6ff;
      font-size: 14px;
      margin: 0 0 16px 0;
    }
    .card p.tags {
      font-size: 12px;
      color: #8ab4d4;
      margin: 0 0 24px 0;
      opacity: 0.8;
    }
    .card button {
      border: none;
      border-radius: 999px;
      padding: 14px 28px;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      font-family: inherit;
      transition: transform 0.1s ease;
      width: 100%;
    }
    .card button:active {
      transform: scale(0.96);
    }
    .btn-magi {
      background: #6f9bff;
      color: #0c152e;
    }
    .btn-magi:hover { background: #8cc9ff; }
    .btn-lotk {
      background: #c4922a;
      color: #1a1200;
    }
    .btn-lotk:hover { background: #f5c96c; }
    .footer {
      position: absolute;
      bottom: 24px;
      color: #555c7a;
      font-size: 12px;
      z-index: 10;
    }
    .glyph {
      position: absolute;
      color: rgba(255, 255, 255, 0.05);
      font-size: 24px;
      font-weight: bold;
      pointer-events: none;
      animation: floatUp 7s linear forwards;
    }
    @keyframes floatUp {
      0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateY(-100px) rotate(360deg); opacity: 0; }
    }
    @media (max-width: 720px) {
      .cards { flex-direction: column; align-items: center; }
      .card { width: min(340px, 90vw); }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>✨ MAGI QUEST ACADEMY ✨</h1>
    <p>Choose your adventure</p>
  </div>
  <div class="cards">
    <div class="card" style="border-color: rgba(111,155,255,0.2)">
      <div class="card-emoji">🧙</div>
      <h2>MagiWolf Quest</h2>
      <p class="subtitle">Spelling & Word Adventure</p>
      <p class="tags">Ages 5–12 · Platformer · Spelling</p>
      <button class="btn-magi" onclick="window.location.href='magiquest.html'">▶ Play Now</button>
    </div>
    <div class="card" style="border-color: rgba(196,146,42,0.2)">
      <div class="card-emoji">💍</div>
      <h2>Lord of the Keys</h2>
      <p class="subtitle">Typing Quest Adventure</p>
      <p class="tags">Ages 5–12 · Typing · LOTR-Inspired</p>
      <button class="btn-lotk" onclick="window.location.href='lotk.html'">⚔ Begin Quest</button>
    </div>
  </div>
  <div class="footer">Built for learning and fun</div>

  <script>
    const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZαβΩ∑Ψ';
    setInterval(() => {
      const el = document.createElement('div');
      el.className = 'glyph';
      el.innerText = chars[Math.floor(Math.random() * chars.length)];
      el.style.left = Math.random() * 100 + 'vw';
      el.style.fontSize = (20 + Math.random() * 30) + 'px';
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 7000);
    }, 800);
  </script>
</body>
</html>
